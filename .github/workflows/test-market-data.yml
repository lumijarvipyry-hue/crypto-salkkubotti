name: Test market data and strategy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/market_data.py"
      - "strategy/indicators.py"
      - "strategy/scanner.py"
      - "strategy/signals.py"
      - "tests/test_indicators.py"
      - "tests/test_scanner.py"
      - "tests/test_signals.py"
      - "requirements.txt"
      - ".github/workflows/test-market-data.yml"

permissions:
  contents: read

jobs:
  test-market-data-and-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile data/market_data.py
          python -m py_compile strategy/indicators.py
          python -m py_compile strategy/scanner.py
          python -m py_compile strategy/signals.py
          python -m py_compile tests/test_indicators.py
          python -m py_compile tests/test_scanner.py
          python -m py_compile tests/test_signals.py

      - name: Test technical indicators
        run: python tests/test_indicators.py

      - name: Test market scanner
        run: python tests/test_scanner.py

      - name: Test strategy signals
        run: python tests/test_signals.py

      - name: Download and validate market data
        run: python data/market_data.py

      - name: Save approved data and audit report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-market-data
          path: |
            data/history/*.csv
            data/market_data_audit.csv
            data/approved_assets.txt
          if-no-files-found: error
          retention-days: 7
