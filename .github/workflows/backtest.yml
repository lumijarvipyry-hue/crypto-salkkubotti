name: Run strategy backtest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backtest.py"
      - "data/market_data.py"
      - "strategy/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/backtest.yml"

permissions:
  contents: read

jobs:
  run-point-in-time-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile backtest.py
          python -m py_compile data/market_data.py
          python -m py_compile strategy/indicators.py
          python -m py_compile strategy/scanner.py
          python -m py_compile strategy/signals.py

      - name: Run existing strategy tests
        run: |
          python tests/test_indicators.py
          python tests/test_scanner.py
          python tests/test_signals.py

      - name: Download and validate fresh market data
        run: python data/market_data.py

      - name: Run point-in-time backtest
        run: python backtest.py

      - name: Save backtest results
        uses: actions/upload-artifact@v4
        with:
          name: crypto-backtest-results
          path: |
            data/backtest_trades.csv
            data/backtest_summary.csv
            data/market_data_audit.csv
            data/approved_assets.txt
          if-no-files-found: error
          retention-days: 14
